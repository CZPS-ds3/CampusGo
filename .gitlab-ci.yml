# GitLab pipeline for Campus & City Quest. It replaces Auto DevOps, which cannot build this npm
# workspaces project and caused failing pipelines. The same checks run locally with `npm run check`.
#
# Jobs on every pipeline: lint (ESLint + Prettier), node config tests, the Docker compose check, Python lint and
# Python unit tests, backend tests (real MySQL 8.4 service), frontend tests, the integration tests (database, API,
# security and regression suites through tests/run-all.mjs) and the build.
# The browser tests (Playwright, phone/tablet/laptop sizes) are a manual job: start them from the pipeline page.

stages:
  - check
  - test
  - build

# One pipeline per push or merge request, never both for the same commit.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  image: node:22
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    # `npm ci` also runs scripts/setup.mjs, which creates backend/.env and frontend/.env with random secrets.
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

variables:
  # Never start Docker from the npm scripts: the database is the MySQL service below.
  SKIP_DOCKER: '1'
  # The MySQL service needs a few seconds to start; the migration waits for it instead of failing at once.
  DB_WAIT_SECONDS: '90'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

lint:
  stage: check
  script:
    - npm run lint
    - npm run format:check

# Start-up rules that need no database: production config, start-up errors, no route hands out a login code (BR52).
node-config:
  stage: check
  script:
    - node --test tests/node/config.test.mjs

# docker-compose.yml must stay valid for `npm run docker:up` and `npm run dev` (which starts only its mysql service).
# `docker compose config` only reads the file, so no Docker daemon is needed on the runner.
docker-config:
  stage: check
  image: docker:27-cli
  cache: {}
  before_script: []
  script:
    - docker compose config --quiet
    - docker compose config --services | grep -qx mysql
    - docker compose config --services | grep -qx backend
    - docker compose config --services | grep -qx frontend
    # Production stack: dummy values only to check the file (the real ones live in .env.production on the server).
    # Every ${NAME:?...} of docker-compose.prod.yml needs a value here, or `config` fails (regression test).
    - printf 'PUBLIC_URL=https://ci.invalid\nMYSQL_ROOT_PASSWORD=ci\nMYSQL_PASSWORD=ci\nSESSION_SECRET=ci\nOTP_SECRET=ci\nSMTP_HOST=ci.invalid\nSMTP_FROM=ci@ci.invalid\nTRUSTED_PROXIES=127.0.0.1\n' > .env.production
    - docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet
    - docker compose --env-file .env.production -f docker-compose.prod.yml config --services | grep -qx web
    - rm .env.production

backend-tests:
  stage: test
  # A MySQL service that did not start (for example a runner with a full disk) is an infrastructure problem,
  # not a code problem: one automatic retry runs the job again on a fresh container.
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  services:
    - name: mysql:8.4
      command:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_0900_ai_ci
        - --default-time-zone=+00:00
  variables:
    MYSQL_ROOT_PASSWORD: cq_root_ci_password
    MYSQL_DATABASE: campusquest_test
    MYSQL_USER: cq
    MYSQL_PASSWORD: cq_dev_password
    TEST_DATABASE_URL: mysql://cq:cq_dev_password@mysql:3306/campusquest_test
  script:
    - npm run migrate:test --prefix backend
    - npm test --prefix backend

frontend-tests:
  stage: test
  script:
    - npm test --prefix frontend

build:
  stage: build
  script:
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - frontend/dist/

# Browser tests with the in-browser mock API. Manual and allowed to fail, so a slow runner never blocks a merge.
e2e-mock:
  stage: test
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  when: manual
  allow_failure: true
  script:
    - npm run e2e --prefix frontend
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - frontend/test-results/

# Python tests: formatting, lint and the unit tests run here; the stack tests run in integration-tests.
python-lint:
  stage: check
  image: python:3.11
  cache: {}
  before_script:
    - python -m pip install --quiet -r tests/requirements.txt
  script:
    - python -m black --check --config tests/pyproject.toml tests/conftest.py tests/python tests/regression
    - python -m pylint --rcfile tests/.pylintrc tests/conftest.py tests/python tests/regression
    # Data files, reference rules and the Docker files: no stack needed.
    - python -m pytest -c tests/pyproject.toml tests/python/unit

# Database, integration, security and regression tests through tests/run-all.mjs (restarts everything once on a
# failure). Runs on every pipeline, so a change that breaks the API, the database or a fixed bug cannot be merged.
integration-tests:
  stage: test
  image: node:24-bookworm
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  services:
    - name: mysql:8.4
      command:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_0900_ai_ci
        - --default-time-zone=+00:00
  variables:
    MYSQL_ROOT_PASSWORD: cq_root_ci_password
    MYSQL_DATABASE: campusquest_test
    MYSQL_USER: cq
    MYSQL_PASSWORD: cq_dev_password
    TEST_DATABASE_URL: mysql://cq:cq_dev_password@mysql:3306/campusquest_test
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - apt-get update -qq && apt-get install -y -qq python3-venv python3-pip
    - python3 -m venv .venv
    - . .venv/bin/activate && pip install --quiet -r tests/requirements.txt
  script:
    - . .venv/bin/activate && node tests/run-all.mjs --ci --only python-unit,node-config,python-db,python-api,python-security,regression
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/reports/summary.json
      - tests/reports/api.log
