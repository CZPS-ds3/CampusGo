# nginx inside the production web container (frontend/Dockerfile). The school's web server terminates HTTPS
# and forwards plain HTTP to this container; nginx serves the built app and passes /api and /uploads on to the
# API container. Keep the X-Forwarded-* headers: the API uses them for rate limits (TRUST_PROXY) and cookies.

# The protocol the visitor really used: the school's proxy says "https"; without a proxy it is our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  # Profile and team pictures (MAX_PROFILE_PICTURE_MB, default 2 MB) plus the multipart overhead.
  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 60s;
  }

  location /uploads/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Built files have a content hash in their name, so they can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Every app route (/map, /quiz/3, /admin, ...) gets index.html; index.html itself is never cached, so a new
  # deployment reaches everyone at once.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}
