services:
  mysql:
    image: mysql:8.4
    container_name: campus-city-quest-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: cq_root_dev_password
      MYSQL_USER: cq
      MYSQL_PASSWORD: cq_dev_password
      TZ: UTC
    ports:
      - '3307:3306'
    volumes:
      - cq-mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -pcq_root_dev_password --silent']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

volumes:
  cq-mysql-data:
